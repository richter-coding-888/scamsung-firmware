name: Check firmware update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
        # Device list
          - model: "SM-S911N" # Galaxy S23
            csc: "KOO"
            omc: "OKR"
            imei: "354619982280934"
          
          - model: "SM-S916N" #Galaxy S23+
            csc: "KOO"
            omc: "OKR"
            imei: "355468150850816"

          - model: "SM-S918N" # Galaxy S23 Ultra
            csc: "KOO"
            omc: "OKR"
            imei: "353992851826496"

          - model: "SM-S921N" # Galaxy S24
            csc: "KOO"
            omc: "OKR"
            imei: "350493702899090"

          - model: "SM-S926N" # Galaxy S24+
            csc: "KOO"
            omc: "OKR"
            imei: "350850260834266"

          - model: "SM-S928N" # Galaxy S24 Ultra
            csc: "KOO"
            omc: "OKR"
            imei: "350513042022994"

          - model: "SM-S721N" # Galaxy S24 FE
            csc: "KOO"
            omc: "OKR"
            imei: "351917372803445"

          - model: "SM-F731N" # Galaxy Z Flip5
            csc: "KOO"
            omc: "OKR"
            imei: "355755471923094"
            
          - model: "SM-F946N" # Galaxy Z Fold5
            csc: "KOO"
            omc: "OKR"
            imei: "352926710903022"
        # End
   
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Compare latest version with current version
        run: |
          need_update=0
          latest="$(curl --fail --retry 5 --retry-delay 5 --silent http://fota-cloud-dn.ospserver.net/firmware/${{ matrix.csc }}/${{ matrix.model }}/version.xml | grep latest | sed 's/^[^>]*>//' | sed 's/<.*//')"
          latest_short="$(echo "$latest" | cut -d'/' -f1)"
          latest_csc="$(echo "$latest" | cut -d'/' -f2)"
          current="$(cat "current.${{ matrix.model }}_${{ matrix.csc }}_${{ matrix.omc }}" 2>/dev/null || true)"
          [[ "$latest" != "$current" ]] && need_update=1
          echo "latest_version=$latest" >> $GITHUB_ENV
          echo "latest_shortversion=$latest_short" >> $GITHUB_ENV
          echo "latest_cscversion=$latest_csc" >> $GITHUB_ENV
          echo "need_update=$need_update" >> $GITHUB_ENV

      - name: Free up workflow space
        run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh


      - name: Install dependencies
        if: env.need_update == 1
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-tool zip android-sdk-libsparse-utils python3 python3-venv unzip

      - name: Install samloader
        if: env.need_update == 1
        run: |
          python3 -m venv py_env
          source py_env/bin/activate
          pip3 install git+https://github.com/ananjaser1211/samloader.git
          deactivate

      - name: Fetch firmware
        if: env.need_update == 1
        run: |
          source py_env/bin/activate
          mkdir "${{ matrix.model }}_${{ matrix.csc }}"
          # https://github.com/ExtremeXT/ExtremeROM/blob/v2.6.1/scripts/download_fw.sh#L169-L192
          C=1
          while true; do
              samloader -m ${{ matrix.model }} -r ${{ matrix.csc }} -i ${{ matrix.imei }} download -O "${{ matrix.model }}_${{ matrix.csc }}" || true
              ZIP_FILE="$(find "${{ matrix.model }}_${{ matrix.csc }}" -name "*.zip" | sort -r | head -n 1)"
              if [[ ! "$ZIP_FILE" ]] || [[ ! -f "$ZIP_FILE" ]]; then
                  if [[ "$C" -gt 10 ]]; then
                      exit 1
                  fi
                  echo -e "[Attempt: $C] Download failed, retrying in 5 seconds..."
                  sleep 5
                  ((C++))
              else
                  break
              fi
          done
          unzip -q "$ZIP_FILE" -d "${{ matrix.model }}_${{ matrix.csc }}/extracted"
          rm -f "$ZIP_FILE"
          deactivate
          rm -rf py_env

      - name: Get path of files
        if: env.need_update == 1
        run: |
          ap_tar="$(find . -type f -name 'AP*' -print -quit)"
          bl_tar="$(find . -type f -name 'BL*' -print -quit)"
          [[ -n "$ap_tar" ]] || { echo "AP archive not found"; exit 1; }
          echo "ap_tar=$ap_tar" >> "$GITHUB_ENV"
          echo "bl_tar=$bl_tar" >> "$GITHUB_ENV"

      - name: Check downloaded firmware version
        if: env.need_update == 1
        run: |
          version_short="$(basename "${{ env.ap_tar }}" | cut -d'_' -f3)"
          [[ "$version_short" == "${{ env.latest_shortversion }}" ]]
          echo "PDA version: $version_short" > versions.txt

      - name: Extract release images
        if: env.need_update == 1
        env:
          AP_TAR: ${{ env.ap_tar }}
          BL_TAR: ${{ env.bl_tar }}
        run: |
          set -euo pipefail

          archive_member() {
            local archive="$1"
            local wanted="$2"
            tar -tf "$archive" | awk -v wanted="$wanted" '$0 == wanted || $0 ~ ("/" wanted "$") { print; exit }'
          }

          extract_image_from_archive() {
            local archive="$1"
            local image="$2"
            local member

            [[ -n "$archive" && -f "$archive" ]] || return 1

            member="$(archive_member "$archive" "${image}.lz4")"
            if [[ -n "$member" ]]; then
              tar -xOf "$archive" "$member" > "${image}.lz4"
              lz4 -d "${image}.lz4" "$image"
              rm -f "${image}.lz4"
              return 0
            fi

            member="$(archive_member "$archive" "$image")"
            if [[ -n "$member" ]]; then
              tar -xOf "$archive" "$member" > "$image"
              return 0
            fi

            return 1
          }

          extract_image() {
            local image="$1"

            if extract_image_from_archive "$AP_TAR" "$image" || extract_image_from_archive "$BL_TAR" "$image"; then
              return 0
            fi

            echo "::warning::${image} was not found in the downloaded firmware"
          }

          for image in boot.img dtbo.img init_boot.img recovery.img vendor_boot.img; do
            extract_image "$image"
          done

          if ! extract_image_from_archive "$BL_TAR" vbmeta.img && ! extract_image_from_archive "$AP_TAR" vbmeta.img; then
            echo "::warning::vbmeta.img was not found in the downloaded firmware"
          fi

      - name: Extract dynamic partitions
        if: env.need_update == 1
        env:
          AP_TAR: ${{ env.ap_tar }}
        run: |
          set -euo pipefail

          archive_member() {
            local wanted="$1"
            tar -tf "$AP_TAR" | awk -v wanted="$wanted" '$0 == wanted || $0 ~ ("/" wanted "$") { print; exit }'
          }

          super_member="$(archive_member super.img.lz4)"
          if [[ -n "$super_member" ]]; then
            tar -xOf "$AP_TAR" "$super_member" > super.img.lz4
            # Match the original workflow: AP is no longer needed after
            # super.img.lz4 has been copied, and keeping it wastes runner disk.
            rm -f "$AP_TAR"
            lz4 -d super.img.lz4 super.img
            rm -f super.img.lz4

            if simg2img super.img super.raw.img >/dev/null 2>&1; then
              mv -f super.raw.img super.img
            else
              rm -f super.raw.img
            fi

            # system, vendor, vendor_dlkm, and system_dlkm are all logical
            # partitions stored in super.img. Extract each one from super.
            for partition in system vendor; do
              rm -f "${partition}.img"
              if ! ./tools/lpunpack -p "$partition" super.img .; then
                echo "::warning::${partition}.img was not found in super.img"
              fi
            done

            # vendor_dlkm and system_dlkm are EROFS logical partitions.
            # Preserve the extracted images without sparse conversion.
            for partition in vendor_dlkm system_dlkm; do
              rm -f "${partition}.img"
              if ! ./tools/lpunpack -p "$partition" super.img .; then
                echo "::warning::${partition}.img was not found in super.img"
              fi
            done
            rm -f super.img
          fi

          normalize_sparse() {
            local image="$1"
            local raw_image="${image%.img}.raw.img"

            [[ -f "$image" ]] || return 0
            if simg2img "$image" "$raw_image" >/dev/null 2>&1; then
              mv -f "$raw_image" "$image"
            else
              rm -f "$raw_image"
            fi
          }

          normalize_sparse system.img
          normalize_sparse vendor.img

      - name: Validate and package release assets
        if: env.need_update == 1
        run: |
          set -euo pipefail

          required_images=(
            boot.img
            dtbo.img
            init_boot.img
            recovery.img
            vendor_boot.img
            vbmeta.img
            vendor_dlkm.img
            system_dlkm.img
            system.img
            vendor.img
          )

          for image in "${required_images[@]}"; do
            if [[ ! -f "$image" ]]; then
              echo "::error::Required release asset is missing: $image"
              exit 1
            fi
          done

          # GitHub limits each release asset to 2 GiB. Keep every split ZIP
          # volume below that limit so the complete archive can be uploaded.
          zip -q -9 -s 1900m "${{ env.latest_shortversion }}_system.zip" system.img
          zip -q -9 -s 1900m "${{ env.latest_shortversion }}_vendor.zip" vendor.img
          rm -f system.img vendor.img

      - name: Upload release assets
        if: env.need_update == 1
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: versions.txt
          tag_name: "${{ env.latest_shortversion }}_${{ matrix.csc }}_${{ matrix.omc }}"
          name: "${{ env.latest_shortversion }} - ${{ matrix.model }} - ${{ matrix.csc }} - ${{ matrix.omc }}"
          fail_on_unmatched_files: true
          files: |
            boot.img
            dtbo.img
            init_boot.img
            recovery.img
            vendor_boot.img
            vbmeta.img
            vendor_dlkm.img
            system_dlkm.img
            ${{ env.latest_shortversion }}_system.*
            ${{ env.latest_shortversion }}_vendor.*

      - name: Update current version
        if: env.need_update == 1
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin "${GITHUB_REF_NAME}" --ff-only
          printf '%s\n' "${{ env.latest_version }}" > "current.${{ matrix.model }}_${{ matrix.csc }}_${{ matrix.omc }}"
          git add "current.${{ matrix.model }}_${{ matrix.csc }}_${{ matrix.omc }}"
          git commit -m "${{ matrix.model }}: ${{ env.latest_shortversion }}"

      - name: Push changes to repo
        if: env.need_update == 1
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
